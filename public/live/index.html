<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c09">
<meta name="robots" content="noindex">
<title>ยอดขายสด</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap">
<style>
  :root { --bg: #140c09; --card: #21140f; --card2: #2c1a13; --line: #3d261c; --text: #fbeee6; --muted: #c4a597; --brand: #ff5a3c; --ok: #4ade80; --warn: #fbbf24;
    --hf: Prompt, Sarabun, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(120% 60% at 50% -10%, #3b1a10, var(--bg) 60%) fixed, var(--bg); color: var(--text); font-family: Sarabun, 'Noto Sans Thai', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { width: min(760px, 100%); margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { margin: 0; font-family: var(--hf); font-size: 1.15em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: rgb(255 90 60 / .16); color: var(--brand); font-weight: 800; font-size: .8em; letter-spacing: .08em; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
  .live.off { background: rgb(255 255 255 / .08); color: var(--muted); } .live.off i { animation: none; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgb(255 90 60 / .6); } 50% { box-shadow: 0 0 0 6px rgb(255 90 60 / 0); opacity: .6; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; }
  .hero { background: linear-gradient(140deg, #ff5a3c, #b8160f); border: 0; color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / .25), transparent 65%); }
  .hero small { opacity: .85; font-weight: 700; }
  .big { font-family: var(--hf); font-weight: 800; font-size: clamp(42px, 13vw, 72px); line-height: 1.05; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .big .cur { font-size: .45em; opacity: .85; margin-left: 4px; }
  .sub { opacity: .9; font-weight: 600; margin-top: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
  .tile small { color: var(--muted); font-weight: 700; font-size: .8em; display: block; }
  .tile b { font-family: var(--hf); font-size: 1.45em; font-variant-numeric: tabular-nums; }
  h2 { margin: 0 0 10px; font-family: var(--hf); font-size: 1em; color: var(--muted); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; height: 100%; }
  .bars .b .col { width: 100%; flex: 1; display: flex; align-items: flex-end; }
  .bars .b i { width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(#ff8a5c, #e8321f); min-height: 3px; transition: height .6s cubic-bezier(.22,1,.36,1); }
  .bars .b.now i { background: linear-gradient(#ffd27a, #ff8a3d); box-shadow: 0 0 12px rgb(255 160 60 / .5); }
  .bars .b small { color: var(--muted); font-size: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row span { min-width: 0; }
  .meter { height: 6px; border-radius: 99px; background: var(--card2); overflow: hidden; margin-top: 5px; } .meter i { display: block; height: 100%; background: var(--brand); border-radius: inherit; transition: width .6s; }
  .bill { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .bill:last-child { border-bottom: 0; }
  .bill .t { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
  .bill small { color: var(--muted); display: block; }
  .bill.new { animation: newbill 2.4s ease-out; border-radius: 12px; }
  @keyframes newbill { 0% { background: rgb(255 90 60 / .35); transform: translateX(-8px); } 100% { background: transparent; transform: none; } }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .warn { color: var(--warn); }
  .foot { color: var(--muted); font-size: .8em; text-align: center; }
  .msg { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); }
  .msg b { display: block; font-family: var(--hf); font-size: 1.3em; color: var(--text); margin-bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { .live i, .bill.new { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">กำลังโหลด…</div></div>
<script type="module" src="/live/live.js"></script>
</body>
</html>
