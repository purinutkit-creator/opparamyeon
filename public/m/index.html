<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4202f">
<title>สั่งอาหาร · Oppa Ramyeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body { max-width: 640px; margin: 0 auto; padding-bottom: 96px; }
  header.h { display: flex; gap: .7em; align-items: center; padding: 1em; background: var(--surface); position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
  header.h img { height: 44px; border-radius: 10px; }
  .cats { position: sticky; top: 76px; background: var(--bg); padding: .5em 1em; z-index: 4; }
  .list { padding: 0 1em; display: grid; gap: .7em; }
  .p { display: grid; grid-template-columns: 96px 1fr; gap: .8em; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .6em; text-align: left; cursor: pointer; }
  .p .im { width: 96px; height: 96px; border-radius: 12px; background: var(--surface2) center/cover; display: grid; place-items: center; font-size: 2em; }
  .p.out { opacity: .5; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); max-width: 640px; margin: 0 auto; z-index: 10; }
  .opt-group .opts { display: flex; flex-wrap: wrap; gap: .5em; }
  .opt { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: .6em .9em; min-height: 48px; font-weight: 700; }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); }
  .steps { display: flex; gap: .3em; margin: .6em 0; }
  .steps span { flex: 1; text-align: center; padding: .4em .2em; border-radius: 8px; background: var(--surface2); font-size: .82em; font-weight: 700; }
  .steps span.on { background: var(--ok); color: #fff; }
  .section { padding: 1em; }
  header.h { background: var(--grad); color: #fff; border: 0; border-radius: 0 0 26px 26px; box-shadow: 0 10px 26px rgb(var(--brand-rgb) / .25); overflow: hidden; }
  header.h::after { content: ''; position: absolute; width: 160px; height: 160px; border-radius: 50%; right: -50px; top: -70px; background: radial-gradient(circle, rgb(255 255 255 / .25), transparent 65%); pointer-events: none; }
  header.h .small.muted { color: rgb(255 255 255 / .85); }
  header.h .btn { background: rgb(255 255 255 / .18); color: #fff; border-color: rgb(255 255 255 / .35); }
  .cats { top: 84px; }
  .p { border: 0; box-shadow: var(--shadow); border-radius: 22px; }
  .p .im { border-radius: 18px; }
  .bar { border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgb(var(--shadow-rgb) / .12); border: 0; }
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<script type="module" src="/m/m.js"></script>
</body>
</html>
