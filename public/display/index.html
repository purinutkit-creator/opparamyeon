<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จอลูกค้า · Oppa Ramyeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  /* Customer display v2: deep backdrop tinted by the shop accent, glass cards, big friendly numbers. */
  :root { --a: var(--d-accent, #ef4444); --bg0: var(--d-bg, #111827); --fg: var(--d-fg, #fff);
    --a-soft: color-mix(in srgb, var(--a) 22%, transparent); --a-deep: color-mix(in srgb, var(--a) 70%, #000);
    /* shop-adjustable (จัดการร้าน → จอลูกค้า → สีและสไตล์) */
    --bg1: var(--d-bg2, color-mix(in srgb, var(--bg0) 92%, #fff)); --card: var(--d-card, var(--fg)); --cop: var(--d-card-op, 8%);
    --ok: var(--d-ok, #22c55e); --ok-d: color-mix(in srgb, var(--ok) 80%, #000); --ok-d2: color-mix(in srgb, var(--ok) 60%, #000); --ok-l: color-mix(in srgb, var(--ok) 70%, #fff); --ok-l2: color-mix(in srgb, var(--ok) 45%, #fff);
    --warn: var(--d-warn, #facc15); --warn-l: color-mix(in srgb, var(--warn) 50%, #fff);
    --gold: var(--d-gold, #f6c453); --gold-l: color-mix(in srgb, var(--gold) 45%, #fff); --gold-d: color-mix(in srgb, var(--gold) 75%, #7c2d12); --memtxt: var(--d-memtxt, #3b2304);
    --hl: var(--d-hl, var(--a)); --qc: var(--d-qty, var(--a)); --ph: var(--d-payhead, var(--a)); --tot1: var(--d-tot1, #fff); --tot2: var(--d-tot2, color-mix(in srgb, var(--a) 35%, #fff));
    --qrh: var(--d-qrh, #0f2a5f); --qrh-l: color-mix(in srgb, var(--qrh) 75%, #fff); --qrh-d: color-mix(in srgb, var(--qrh) 70%, #000);
    --isc: var(--d-isc, 1); --tsc: var(--d-tsc, 1); --qsc: var(--d-qsc, 1);
    --glass: color-mix(in srgb, var(--card) var(--cop), transparent); --glass-2: color-mix(in srgb, var(--card) calc(var(--cop) + 6%), transparent); --stroke: color-mix(in srgb, var(--fg) 16%, transparent);
    --hf: var(--app-head, 'Prompt'), var(--app-font, 'Sarabun'), sans-serif; }
  html, body { height: 100%; }
  body { overflow: hidden; color: var(--fg); font-family: var(--font);
    background: radial-gradient(90vw 90vh at 110% -10%, color-mix(in srgb, var(--a) 45%, transparent), transparent 60%),
      radial-gradient(70vw 80vh at -20% 120%, color-mix(in srgb, var(--a) 30%, transparent), transparent 60%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg0) 55%, color-mix(in srgb, var(--bg0) 80%, #000) 100%); }
  /* slow floating blobs + fine grain for depth */
  .bgfx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bgfx i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .45; background: var(--a); animation: drift 26s ease-in-out infinite; }
  .bgfx i:nth-child(1) { width: 38vw; height: 38vw; left: -10vw; top: 10vh; }
  .bgfx i:nth-child(2) { width: 30vw; height: 30vw; right: -8vw; bottom: -6vh; background: color-mix(in srgb, var(--a) 60%, #ffb347); animation-delay: -9s; }
  .bgfx i:nth-child(3) { width: 18vw; height: 18vw; left: 45vw; top: -8vh; background: color-mix(in srgb, var(--a) 40%, #fff); opacity: .25; animation-delay: -15s; }
  .bgfx b { position: absolute; border: 2px solid var(--stroke); border-radius: 50%; }
  .bgfx b:nth-of-type(1) { width: 60vh; height: 60vh; right: -20vh; top: -22vh; }
  .bgfx b:nth-of-type(2) { width: 34vh; height: 34vh; left: -12vh; bottom: -12vh; }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(6vw, -4vh) scale(1.12); } 66% { transform: translate(-4vw, 5vh) scale(.92); } }

  .disp { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-columns: 1fr; gap: 2.2vh; padding: 2.2vh; }
  .disp.split.active { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } /* two equal halves, whatever the content */
  .disp.paying { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) !important; }
  .disp:not(.active) { padding: 0; }
  .disp:not(.active) .panel { display: none; }
  .disp.full.active .promo { display: none; }

  /* ----- promotion area ----- */
  .promo { container-type: size; position: relative; overflow: hidden; border-radius: 3.2vh; background: #000; box-shadow: 0 3vh 8vh rgb(0 0 0 / .45); min-height: 0; }
  .disp:not(.active) .promo { border-radius: 0; box-shadow: none; }
  .promo > img, .promo > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: var(--fit, cover); animation: fadein .9s ease; }
  .promo > img { animation: kenburns 14s ease-out both, fadein .9s ease; }
  @keyframes kenburns { from { transform: scale(1.08); } to { transform: scale(1); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .promo .shade { position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(transparent, rgb(0 0 0 / .65)); pointer-events: none; }
  .glassbar { position: absolute; left: 2.4vh; right: 2.4vh; bottom: 2.4vh; display: flex; align-items: center; gap: 2vh; padding: 1.8vh 2.6vh; border-radius: 2.6vh;
    background: color-mix(in srgb, #000 35%, transparent); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgb(255 255 255 / .16); color: #fff; }
  .glassbar img { height: 8vh; max-width: 18vw; object-fit: contain; border-radius: 1.4vh; }
  .glassbar .t { flex: 1; min-width: 0; }
  .glassbar .t b { display: block; font-family: var(--hf); font-size: clamp(18px, 3.6vh, 40px); line-height: 1.15; }
  .glassbar .t span { opacity: .85; font-size: clamp(14px, 2.4vh, 26px); }
  .glassbar .clock { font-family: var(--hf); font-size: clamp(18px, 4.4vh, 48px); font-variant-numeric: tabular-nums; opacity: .95; }
  /* hero when the shop has no promotion media */
  .hero { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(60% 60% at 50% 40%, color-mix(in srgb, var(--a) 55%, #000) 0%, color-mix(in srgb, var(--a) 25%, #000) 55%, #000 100%); }
  .hero .ring { position: absolute; border-radius: 50%; border: 2px solid rgb(255 255 255 / .12); animation: pulse-ring 6s ease-out infinite; }
  .hero .ring:nth-child(2) { animation-delay: -2s; } .hero .ring:nth-child(3) { animation-delay: -4s; }
  @keyframes pulse-ring { from { width: 20vh; height: 20vh; opacity: .9; } to { width: 130vh; height: 130vh; opacity: 0; } }
  .hero .inner { position: relative; z-index: 2; display: grid; justify-items: center; gap: 2vh; padding: 4vh; }
  .hero .bowl { width: min(42vh, 60vw); filter: drop-shadow(0 4vh 6vh rgb(0 0 0 / .5)); animation: floaty 5s ease-in-out infinite; }
  .hero .steam { position: absolute; top: -6vh; left: 50%; width: 30%; height: 12vh; transform: translateX(-50%); }
  .hero .steam i { position: absolute; bottom: 0; width: 1.2vh; height: 8vh; border-radius: 1vh; background: linear-gradient(transparent, rgb(255 255 255 / .55)); filter: blur(3px); animation: steam 3.2s ease-in infinite; }
  .hero .steam i:nth-child(1) { left: 15%; } .hero .steam i:nth-child(2) { left: 45%; animation-delay: -1.1s; } .hero .steam i:nth-child(3) { left: 75%; animation-delay: -2.1s; }
  @keyframes steam { 0% { transform: translateY(2vh) scaleY(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-8vh) scaleY(1.2); opacity: 0; } }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-2.2vh) rotate(2deg); } }
  .hero h1 { margin: 0; font-family: var(--hf); font-size: clamp(26px, min(9vh, 13cqi), 110px); overflow-wrap: break-word; line-height: 1; letter-spacing: -.01em; color: #fff; text-shadow: 0 1vh 4vh rgb(0 0 0 / .45); }
  .hero p { margin: 0; font-size: clamp(18px, 3.6vh, 42px); color: rgb(255 255 255 / .88); }
  .hero .pill { display: inline-block; padding: .5em 1.2em; border-radius: 999px; background: rgb(255 255 255 / .14); border: 1px solid rgb(255 255 255 / .22); font-weight: 700; color: #fff; font-size: clamp(14px, 2.4vh, 26px); }

  /* ----- order panel (glass card) ----- */
  .panel { display: flex; flex-direction: column; min-height: 0; border-radius: 3.2vh; padding: 2.8vh 2.8vh 2.4vh; gap: 1.6vh;
    background: linear-gradient(160deg, var(--glass-2), var(--glass)); border: 1px solid var(--stroke); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
    box-shadow: 0 3vh 8vh rgb(0 0 0 / .35), inset 0 1px 0 rgb(255 255 255 / .12); }
  .ph { display: flex; align-items: center; justify-content: space-between; gap: 1.5vh; }
  .ph h2 { margin: 0; font-family: var(--hf); font-size: clamp(20px, 4vh, 44px); line-height: 1.1; white-space: nowrap; }
  .ph h2 small { display: block; font-family: var(--font); font-size: .45em; font-weight: 600; opacity: .7; letter-spacing: .08em; text-transform: uppercase; }
  .chips { display: flex; gap: 1vh; flex-wrap: wrap; justify-content: flex-end; }
  .chip-d { display: inline-flex; align-items: center; gap: .4em; padding: .45em 1em; border-radius: 999px; font-weight: 800; font-size: clamp(14px, 2.3vh, 26px); background: var(--glass-2); border: 1px solid var(--stroke); white-space: nowrap; }
  .chip-d.takeaway { background: #ea580c; border-color: transparent; color: #fff; }
  .chip-d.dinein { background: color-mix(in srgb, #2563eb 85%, transparent); border-color: transparent; color: #fff; }
  .mem { display: flex; align-items: center; gap: 1.6vh; padding: 1.4vh 1.8vh; border-radius: 2.2vh; color: var(--memtxt);
    background: linear-gradient(120deg, var(--gold-l), var(--gold) 45%, var(--gold-d)); box-shadow: 0 1.4vh 3vh color-mix(in srgb, var(--gold) 35%, transparent); }
  .mem .av { width: 6vh; height: 6vh; border-radius: 1.8vh; display: grid; place-items: center; background: rgb(255 255 255 / .45); font-family: var(--hf); font-size: 3vh; }
  .mem b { font-family: var(--hf); font-size: clamp(16px, 2.8vh, 30px); display: block; line-height: 1.1; }
  .mem span { font-weight: 700; opacity: .8; font-size: clamp(13px, 2vh, 22px); }
  .mem .pts { margin-left: auto; text-align: right; font-family: var(--hf); font-size: clamp(18px, 3.4vh, 38px); line-height: 1; }
  .mem .pts small { display: block; font-family: var(--font); font-size: .45em; font-weight: 700; }
  .itemswrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .items { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1.1vh; font-size: calc(clamp(16px, 2.6vh, 30px) * var(--isc)); }
  .items > .it { flex: none; }
  .items.fade-up { -webkit-mask-image: linear-gradient(transparent, #000 12%); mask-image: linear-gradient(transparent, #000 12%); }
  .items.fade-down { -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .items.fade-up.fade-down { -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
  .it { display: grid; grid-template-columns: auto 1fr auto; gap: 1.6vh; align-items: center; padding: 1.2vh 1.6vh; border-radius: 2vh; background: var(--glass); border: 1px solid transparent; }
  .it.new { animation: slidein .55s cubic-bezier(.2, .9, .3, 1.3), glow 2.2s ease-out; }
  .it.more-q { animation: glow 2.2s ease-out; } .it.more-q .q { animation: qbump .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes qbump { 40% { transform: scale(1.35); } }
  /* the most recently added line keeps a soft colour wash until the next one */
  .it.latest { position: relative; overflow: hidden; border-color: color-mix(in srgb, var(--hl) 45%, transparent);
    background: linear-gradient(100deg, color-mix(in srgb, var(--hl) 22%, var(--glass)), var(--glass) 70%); box-shadow: 0 0 2.4vh color-mix(in srgb, var(--hl) 22%, transparent); }
  .it.latest.new, .it.latest.more-q { animation-fill-mode: none; }
  .it.latest::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--hl) 18%, transparent) 50%, transparent 70%); background-size: 250% 100%; animation: shimmer 3.2s ease-in-out infinite; }
  .it.latest::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: .5vh; border-radius: 0 9px 9px 0; background: var(--hl); box-shadow: 0 0 1.4vh var(--hl); }
  .it .ltag { display: inline-block; vertical-align: middle; margin-left: .5em; font-style: normal; font-size: .55em; font-weight: 800; padding: .15em .6em; border-radius: 99px; color: #fff;
    background: color-mix(in srgb, var(--a) 85%, #000); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
  @keyframes slidein { from { transform: translateX(6vw); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes glow { 0% { border-color: var(--a); background: var(--a-soft); } 100% { border-color: transparent; background: var(--glass); } }
  .it .q { min-width: 5.4vh; height: 5.4vh; padding: 0 1vh; border-radius: 1.8vh; display: grid; place-items: center; font-family: var(--hf); font-size: 1.15em; color: #fff;
    background: linear-gradient(135deg, color-mix(in srgb, var(--qc) 80%, #fff), color-mix(in srgb, var(--qc) 70%, #000)); box-shadow: 0 .8vh 2vh color-mix(in srgb, var(--qc) 40%, transparent); }
  .it .n { min-width: 0; } .it .n b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: break-word; word-break: normal; font-weight: 800; line-height: 1.2; } /* long names: up to 2 lines */
  .it .n small { display: flex; flex-wrap: wrap; gap: .5vh; margin-top: .6vh; font-size: .62em; }
  .it .n small span { padding: .15em .7em; border-radius: 999px; background: var(--glass-2); font-weight: 700; }
  .it .n small span.add { background: color-mix(in srgb, var(--gold) 85%, transparent); color: var(--memtxt); }
  .it .n small span.yes, .it .n small span.no { display: inline-flex; align-items: center; gap: .4em; padding-left: .3em; }
  .it .n small span.yes { background: color-mix(in srgb, var(--ok) 22%, transparent); color: #bbf7d0; }
  .it .n small span.no { background: rgb(239 68 68 / .2); color: #fecaca; text-decoration: line-through; text-decoration-color: rgb(254 202 202 / .6); }
  .it .n small span i { font-style: normal; width: 1.45em; height: 1.45em; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .85em; color: #fff; text-decoration: none; }
  .it .n small span.yes i { background: var(--ok-d); } .it .n small span.no i { background: #dc2626; }
  .it.new .n small span.yes i, .it.new .n small span.no i { animation: popin .5s .3s cubic-bezier(.2,1.5,.4,1) both; }
  .it .n small span.tw { background: #ea580c; color: #fff; }
  .it .p { font-family: var(--hf); font-variant-numeric: tabular-nums; }
  .more { position: absolute; left: 50%; z-index: 2; pointer-events: none; white-space: nowrap; font-weight: 800; font-size: clamp(12px, 1.9vh, 20px); padding: .3em 1em; border-radius: 99px;
    color: #fff; background: color-mix(in srgb, var(--a) 85%, #000); box-shadow: 0 .8vh 2.4vh rgb(0 0 0 / .35); opacity: 0; transform: translate(-50%, -40%) scale(.8); transition: opacity .3s, transform .35s cubic-bezier(.2,.9,.3,1.4); }
  .more.up { top: 0; } .more.down { bottom: 0; transform: translate(-50%, 40%) scale(.8); }
  .more.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .sum { border-top: 1px dashed var(--stroke); padding-top: 1.6vh; display: grid; gap: .6vh; font-size: clamp(15px, 2.4vh, 26px); }
  .sum .r { display: flex; justify-content: space-between; opacity: .85; }
  .sum .grand { display: flex; justify-content: space-between; align-items: flex-end; margin-top: .8vh; opacity: 1; }
  .sum .grand span { font-weight: 700; }
  .sum .grand small { display: block; font-weight: 600; opacity: .7; font-size: .8em; }
  .sum .total { font-family: var(--hf); font-size: calc(clamp(38px, 8.5vh, 104px) * var(--tsc)); line-height: .95; font-variant-numeric: tabular-nums;
    background: linear-gradient(120deg, var(--tot1), var(--tot2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sum .total.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.06); } }

  /* ----- payment (replaces the promotion half) ----- */
  .disp.paying .promo { order: 2; background: transparent; box-shadow: none; overflow: visible; display: flex; }
  .disp.paying .panel { order: 1; }
  .paybox { flex: 1; display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
  .payhead { border-radius: 3.2vh; padding: 2.8vh 3.4vh; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--ph) 75%, #fff) -20%, var(--ph) 40%, color-mix(in srgb, var(--ph) 70%, #000) 100%); box-shadow: 0 3vh 7vh color-mix(in srgb, var(--ph) 45%, transparent); }
  .payhead::after { content: ''; position: absolute; width: 40vh; height: 40vh; border-radius: 50%; right: -14vh; top: -18vh; background: rgb(255 255 255 / .14); }
  .payhead .lbl { position: relative; font-weight: 700; font-size: clamp(16px, 2.8vh, 30px); opacity: .95; }
  .payhead .amt { position: relative; font-family: var(--hf); font-size: clamp(54px, 13vh, 170px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .payhead .amt small { font-size: .38em; margin-left: .2em; }
  .paybox { animation: payin .55s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes payin { from { opacity: 0; transform: translateY(3vh) scale(.97); } }
  .paybox { position: relative; }
  .paybox > :not(.sparks) { position: relative; z-index: 1; }
  .sparks { position: absolute; inset: -2vh; pointer-events: none; z-index: 0; overflow: hidden; }
  .sparks i { position: absolute; bottom: -2vh; width: .8vh; height: .8vh; border-radius: 50%; background: color-mix(in srgb, var(--a) 60%, #fff); box-shadow: 0 0 1.4vh .3vh color-mix(in srgb, var(--a) 60%, transparent); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 10% { opacity: .8; } 80% { opacity: .5; } to { transform: translateY(-105vh) translateX(3vh); opacity: 0; } }
  .paytop { display: flex; align-items: center; justify-content: space-between; gap: 2vh; }
  .qchip { display: inline-flex; align-items: center; gap: .5em; font-family: var(--hf); font-size: clamp(22px, 4.4vh, 52px); line-height: 1; padding: .28em .7em .3em; border-radius: 99px; color: #fff;
    background: linear-gradient(135deg, color-mix(in srgb, var(--a) 70%, #fff), var(--a-deep)); box-shadow: 0 0 0 .4vh color-mix(in srgb, var(--a) 30%, transparent), 0 1.4vh 4vh color-mix(in srgb, var(--a) 45%, transparent); animation: pop .5s cubic-bezier(.2,.9,.3,1.4), qglow 2.4s 1s ease-in-out infinite; }
  .qchip small { font-family: var(--font); font-weight: 800; font-size: .42em; opacity: .9; letter-spacing: .06em; }
  .qchip.soft { background: var(--glass-2); box-shadow: none; border: 1px solid var(--stroke); font-size: clamp(14px, 2.4vh, 26px); font-family: var(--font); font-weight: 800; animation: pop .5s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes qglow { 50% { box-shadow: 0 0 0 1.1vh color-mix(in srgb, var(--a) 10%, transparent), 0 1.4vh 4vh color-mix(in srgb, var(--a) 45%, transparent); } }
  .pclock { display: flex; align-items: baseline; gap: .7em; padding: .35em .9em; border-radius: 99px; background: var(--glass); border: 1px solid var(--stroke); font-size: clamp(11px, 1.7vh, 18px); line-height: 1.2; white-space: nowrap; }
  .pclock b { font-family: var(--hf); font-size: 1.15em; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .pclock span { font-weight: 700; opacity: .7; }
  .payhead .shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .28) 50%, transparent 65%); background-size: 250% 100%; animation: shimmer 4.5s ease-in-out infinite; z-index: 1; }
  .paybreak:empty { display: none; }
  .paybreak { position: relative; z-index: 2; margin-top: 1.4vh; padding-top: 1.2vh; border-top: 1px dashed rgb(255 255 255 / .4); display: grid; gap: .5vh; font-size: clamp(14px, 2.2vh, 24px); }
  .paybreak .br { display: flex; justify-content: space-between; gap: 2vh; font-weight: 700; animation: brin .5s cubic-bezier(.2,.9,.3,1.2) both; }
  .paybreak .br b { font-variant-numeric: tabular-nums; }
  .paybreak .br.disc b { background: #fff; color: var(--a-deep); padding: 0 .5em; border-radius: .5em; }
  @keyframes brin { from { opacity: 0; transform: translateX(3vh); } }
  .perks { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: .6vh; }
  .perks span { font-weight: 800; padding: .25em .8em; border-radius: 99px; font-size: .95em; animation: pop .5s .5s cubic-bezier(.2,.9,.3,1.5) both; }
  .perks .save { background: var(--warn); color: #422006; }
  .perks .earn { background: rgb(255 255 255 / .92); color: #92400e; }
  /* --- PromptPay QR: loading shimmer → circular reveal → scan laser --- */
  .payarea { flex: 1; min-height: 0; display: grid; place-items: center; }

    background: repeating-conic-gradient(from 0deg, #fff 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 45%); mask: radial-gradient(circle, #000 0, transparent 45%); animation: spin 40s linear infinite; }
  /* leaving (cashier pressed เสร็จ): goodbye → content flies up → iris closes onto the normal screen */
  .done.leaving { animation: iris 1s 1.1s cubic-bezier(.7,0,.3,1) forwards; pointer-events: none; }
  @keyframes iris { from { clip-path: circle(150% at 50% 45%); } to { clip-path: circle(0% at 50% 45%); } }
  .done.leaving .card2 > * { animation: flyaway .55s cubic-bezier(.5,0,.75,0) forwards !important; }
  .done.leaving .card2 > :nth-child(2) { animation-delay: .05s !important; } .done.leaving .card2 > :nth-child(3) { animation-delay: .1s !important; }
  .done.leaving .card2 > :nth-child(4) { animation-delay: .15s !important; } .done.leaving .card2 > :nth-child(n+5) { animation-delay: .2s !important; }
  .done .bye { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 1.4vh; text-align: center; pointer-events: none; }
  .done .bye .hand { font-size: 12vh; line-height: 1; display: inline-block; transform-origin: 70% 80%; animation: popin .5s .2s cubic-bezier(.2,1.5,.4,1) both, handwave .5s .5s ease-in-out 3; }
  .done .bye b { font-family: var(--hf); font-size: clamp(34px, min(8vh, 9vw), 96px); color: #fff; text-shadow: 0 .5vh 3vh rgb(0 0 0 / .4); }
  .done .bye b span { display: inline-block; white-space: pre; animation: letter .6s cubic-bezier(.2,.9,.3,1.6) both; }
  .done .bye small { font-weight: 800; font-size: clamp(14px, 2.4vh, 28px); opacity: .8; letter-spacing: .06em; animation: pop .5s .5s both; }
  @keyframes handwave { 50% { transform: rotate(-18deg); } }
  .done.leaving .rays { animation: spin 3s linear infinite; opacity: .3; }
  @keyframes flyaway { to { transform: translateY(-16vh) scale(.7); opacity: 0; filter: blur(6px); } }
  .disp.welcome-in { animation: welcomein 1.2s .6s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes welcomein { from { opacity: 0; transform: scale(1.06); filter: blur(10px); } }
  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .confetti i { position: absolute; top: -4vh; width: 1.2vh; height: 2.2vh; border-radius: .3vh; scale: var(--s, 1); animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  .floaters { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .floaters i { position: absolute; bottom: -8vh; font-style: normal; opacity: 0; animation: floatup linear infinite; }
  @keyframes floatup { 10% { opacity: .9; } 50% { transform: translateY(-55vh) translateX(3vh) rotate(12deg); } 90% { opacity: .7; } to { transform: translateY(-115vh) translateX(-2vh) rotate(-10deg); opacity: 0; } }
  .fireworks { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .fw { position: absolute; width: 0; height: 0; }
  .fw i { position: absolute; left: -.5vh; top: -.5vh; width: 1vh; height: 1vh; border-radius: 50%; background: var(--c); box-shadow: 0 0 1.4vh var(--c); animation: fwboom 1.3s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes fwboom { 0% { transform: rotate(var(--a)) translateX(0) scale(1.4); opacity: 1; } 70% { opacity: 1; } 100% { transform: rotate(var(--a)) translateX(14vh) translateY(3vh) scale(.3); opacity: 0; } }

  /* ----- pairing & member overlay ----- */
  .pairing { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 1em; }
  .pairing .pbox { width: min(480px, 100%); border-radius: 28px; padding: 28px; color: var(--fg); background: linear-gradient(160deg, var(--glass-2), var(--glass)); border: 1px solid var(--stroke);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 30px 80px rgb(0 0 0 / .4); }
  .pairing h2 { font-family: var(--hf); font-size: 2em; margin: 0 0 .3em; }
  .pairing ol, .pairing .muted { color: var(--fg); opacity: .82; } .pairing .version { color: var(--fg); opacity: .5; } .pairing .input { background: rgb(255 255 255 / .92); color: #111; }
  .pairing .key { background: var(--glass-2); color: var(--fg); border-color: var(--stroke); }
  .overlay { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / .62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; padding: 2vh; }
  .overlay .box { background: var(--surface); color: var(--text); border-radius: 28px; padding: 3vh 3vw; width: min(580px, 96vw); box-shadow: 0 30px 80px rgb(0 0 0 / .45); animation: popin .35s ease; }
  .overlay .box h2 { font-family: var(--hf); text-align: center; }
  .overlay .val { font-family: var(--hf); font-size: 2.4em; text-align: center; letter-spacing: .1em; min-height: 1.4em; border-bottom: 3px solid var(--a); margin-bottom: .5em; }
  .overlay .qr { width: min(46vh, 80%); display: block; margin: 0 auto; background: #fff; padding: 2vh; border-radius: 2vh; }
  .net { position: fixed; right: 1.4vh; bottom: 1vh; font-size: 12px; opacity: .55; z-index: 30; }

  /* portrait screens (vertical customer displays): promotion on top, order below */
  @media (orientation: portrait) {
    .disp.split.active, .disp.paying { grid-template-columns: 1fr !important; grid-template-rows: 34vh 1fr; }
    .disp.split.active.paying, .disp.paying { grid-template-rows: auto minmax(0, 1fr); }
    .disp.paying .paybox > * { flex-shrink: 0; }
    .disp.paying .isqr .qrcard { height: auto; max-height: none; } .disp.paying .isqr .qrframe { flex: none; height: auto; width: min(58vw, 30vh); max-height: none; }
    .disp.paying .promo { order: 1; } .disp.paying .panel { order: 2; }
    .qrcard { width: min(70%, 40vh); }
    .disp.paying .paybox, .disp.paying .cashcard, .disp.paying .payarea { flex: none; }
    .disp.paying .paybox { width: 100%; }
    /* the big amount is already on top while paying: keep the order list short */
    .disp.paying .panel .mem, .disp.paying .panel .sum { display: none; }
    .cashcard { padding: 2vh 2.6vh; gap: 1.2vh; } .cc-head .bill { width: 6vh; height: 4vh; }
    .cc-row.recv b, .cc-change b { font-size: clamp(32px, 6vh, 80px); } .cc-change.show { padding: 1.6vh 2.6vh; }
    .payhead { padding: 2vh 2.6vh; } .payhead .amt { font-size: clamp(44px, 8vh, 110px); }
    .disp.active .hero .bowl { width: 16vh; } .disp.active .hero .inner { gap: 1vh; padding: 2vh; }
    .disp.active .hero h1 { font-size: 5vh; } .disp.active .hero p, .disp.active .hero .pill, .disp.active .hero .steam { display: none; }
    .ph h2 { font-size: 3.2vh; }
    .disp.active .hero ~ .glassbar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }

  /* ----- shop style switches (data-* on <html>) ----- */
  [data-fx-confetti="0"] .confetti, [data-fx-fireworks="0"] .fireworks, [data-fx-floaters="0"] .floaters, [data-fx-floaters="0"] .done .rays,
  [data-fx-money="0"] .coins, [data-fx-money="0"] .rain, [data-fx-sparks="0"] .sparks { display: none !important; }
  [data-fx-shine="0"] .payhead .shine, [data-fx-shine="0"] .qrtitle::after, [data-fx-shine="0"] .done .q::after, [data-fx-shine="0"] .cc-change.show::before, [data-fx-shine="0"] .it.latest::after { display: none; }
  [data-fx-ring="0"] .qrcard::before, [data-fx-ring="0"] .cashcard::before { display: none; }
  [data-fx-latest="0"] .it.latest { background: var(--glass); border-color: transparent; box-shadow: none; } [data-fx-latest="0"] .it.latest::before, [data-fx-latest="0"] .it.latest::after, [data-fx-latest="0"] .it .ltag { display: none; }
  [data-corners="soft"] .panel, [data-corners="soft"] .promo, [data-corners="soft"] .payhead, [data-corners="soft"] .cashcard, [data-corners="soft"] .qrcard, [data-corners="soft"] .done .q { border-radius: 1.4vh; }
  [data-corners="soft"] .it, [data-corners="soft"] .mem, [data-corners="soft"] .cc-change, [data-corners="soft"] .done .stat { border-radius: 1vh; }
  [data-corners="square"] .panel, [data-corners="square"] .promo, [data-corners="square"] .payhead, [data-corners="square"] .cashcard, [data-corners="square"] .qrcard, [data-corners="square"] .done .q,
  [data-corners="square"] .it, [data-corners="square"] .mem, [data-corners="square"] .cc-change, [data-corners="square"] .done .stat, [data-corners="square"] .qrtitle, [data-corners="square"] .qrwell { border-radius: .3vh; }
  /* motion: off = still screen, soft = only the essentials, extra = more life everywhere */
  [data-motion="off"] *, [data-motion="off"] *::before, [data-motion="off"] *::after { animation: none !important; transition: none !important; }
  [data-motion="off"] .qrframe .qrimg { clip-path: none; filter: none; opacity: 1; } [data-motion="off"] .qrframe.ready .qrskel { display: none; }
  [data-motion="soft"] .bgfx, [data-motion="soft"] .sparks, [data-motion="soft"] .floaters, [data-motion="soft"] .fireworks, [data-motion="soft"] .done .rays { display: none; }
  [data-motion="soft"] .it.latest::after, [data-motion="soft"] .payhead .shine { animation: none; display: none; }
  [data-motion="extra"] .it.new { animation: popflip .7s cubic-bezier(.2,.9,.3,1.3), glow 2.4s ease-out; }
  @keyframes popflip { 0% { transform: perspective(600px) rotateX(-70deg) translateY(-2vh); opacity: 0; } 60% { transform: perspective(600px) rotateX(10deg); opacity: 1; } 100% { transform: none; } }
  [data-motion="extra"] .sum .total { animation: totglow 3s ease-in-out infinite; }
  @keyframes totglow { 50% { filter: drop-shadow(0 0 1.6vh color-mix(in srgb, var(--a) 70%, transparent)); } }
  [data-motion="extra"] .panel { animation: panelfloat 7s ease-in-out infinite; }
  @keyframes panelfloat { 50% { transform: translateY(-.5vh); } }
  [data-motion="extra"] .it .q { animation: qwiggle 5s ease-in-out infinite; }
  @keyframes qwiggle { 0%, 90%, 100% { transform: none; } 94% { transform: rotate(-8deg) scale(1.08); } 97% { transform: rotate(6deg); } }
  /* background effect */
  .bgfx .aur, .bgfx .pt { display: none; }
  [data-bg="none"] .bgfx, [data-bg="gradient"] .bgfx { display: none; }
  [data-bg="none"] body { background: var(--bg0); }
  [data-bg="aurora"] .bgfx i, [data-bg="aurora"] .bgfx b, [data-bg="particles"] .bgfx i { display: none; }
  [data-bg="aurora"] .bgfx .aur { display: block; position: absolute; inset: -30%; filter: blur(50px); opacity: .55; mix-blend-mode: screen;
    background: conic-gradient(from 0deg at 30% 40%, transparent, var(--a), transparent 30%, color-mix(in srgb, var(--a) 40%, #38bdf8), transparent 60%, color-mix(in srgb, var(--a) 50%, #a855f7), transparent);
    animation: aurora 22s linear infinite; }
  [data-bg="aurora"] .bgfx .aur.a2 { animation-duration: 34s; animation-direction: reverse; opacity: .35; inset: -40%; }
  @keyframes aurora { to { transform: rotate(360deg); } }
  [data-bg="particles"] .bgfx .pt { display: block; position: absolute; bottom: -2vh; width: .7vh; height: .7vh; border-radius: 50%; background: color-mix(in srgb, var(--a) 50%, #fff);
    box-shadow: 0 0 1.2vh .3vh color-mix(in srgb, var(--a) 60%, transparent); opacity: 0; animation: rise linear infinite; }

  /* one clock on every screen: top-left, seconds + full date */
  .gclock { position: fixed; top: 2vh; left: 2vh; z-index: 60; display: grid; gap: .1em; padding: 1vh 2vh; border-radius: 2vh; color: #fff;
    background: rgb(0 0 0 / .32); border: 1px solid rgb(255 255 255 / .18); text-shadow: 0 2px 10px rgb(0 0 0 / .25); pointer-events: none; animation: popin .6s cubic-bezier(.2,1.4,.4,1) both; }
  .gclock b { font-family: var(--hf); font-size: clamp(22px, 5vh, 56px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .gclock span { font-size: clamp(12px, 1.9vh, 22px); font-weight: 700; opacity: .92; }
  .disp.split .panel .ph { padding-top: .5vh; }
  /* the order list sits on the left half while paying / in the full layout: start it below the clock */
  .disp.paying .panel .ph, .disp.full .panel .ph { margin-top: 9vh; }
  /* what was just added: name, how many, price — pops on every add */
  /* a small strip of its own, set apart from the list (not another list row) */
  .lastadd { display: flex; align-items: center; gap: 1vh; margin: 2.2vh auto .6vh; padding: .55vh 1.4vh .55vh .6vh; width: fit-content; max-width: 100%; border-radius: 99px;
    background: rgb(0 0 0 / .28); border: 1px dashed rgb(255 255 255 / .28); font-size: clamp(11px, 1.7vh, 18px); overflow: hidden; position: relative; white-space: nowrap; }
  .lastadd .la-k { font-weight: 800; padding: .2em .7em; border-radius: 99px; background: var(--hl, #f59e0b); color: #fff; font-size: .9em; }
  .lastadd .la-n { min-width: 0; display: flex; align-items: baseline; gap: .5em; overflow: hidden; }
  .lastadd .la-n b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .lastadd .la-n small { opacity: .7; font-size: .85em; overflow: hidden; text-overflow: ellipsis; }
  .lastadd .la-q { font-family: var(--hf); font-weight: 800; color: var(--hl, #f59e0b); }
  .lastadd .la-p { font-family: var(--hf); font-weight: 700; opacity: .9; } .lastadd .la-p small { font-size: .8em; opacity: .7; font-weight: 600; }
  .lastadd.pop { animation: lapop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  .lastadd.pop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .35) 50%, transparent 70%); transform: translateX(-100%); animation: lashine 1s .2s ease-out both; }
  .lastadd.pop .la-q { animation: qbump .7s .15s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes lapop { 0% { opacity: 0; transform: translateY(1.4vh) scale(.94); } 60% { opacity: 1; transform: translateY(-.3vh) scale(1.02); } 100% { transform: none; } }
  @keyframes lashine { to { transform: translateX(100%); } }
  .sum .grand small { transition: color .3s; }
  @media (prefers-reduced-motion: reduce) { .lastadd.pop, .lastadd.pop::after, .lastadd.pop .la-q, .gclock { animation: none; } }

  /* list: product picture instead of the quantity badge; quantity small on its corner */
  .it .th { position: relative; width: 10vh; height: 10vh; flex: none; border-radius: 2vh; overflow: hidden; background: rgb(255 255 255 / .9); box-shadow: 0 .5vh 1.4vh rgb(0 0 0 / .28); }
  .it .th img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .it .th.noimg img { object-fit: contain; padding: .8vh; }
  .it .p { display: grid; justify-items: end; gap: .6vh; }
  .it .p .q { min-width: 0; height: auto; padding: .3em .8em; border-radius: 99px; font-style: normal; font-size: clamp(12px, 2.3vh, 26px); line-height: 1.1; box-shadow: none; }
  .it.new .th { animation: thin .6s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes thin { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
  /* product details card (👁 on the POS) */
  .showcase { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 10vh 3vh 3vh; background: rgb(0 0 0 / .45); animation: m-fade .4s ease-out both; }
  .showcase.out { animation: scout .45s ease-in forwards; }
  @keyframes scout { to { opacity: 0; } }
  @keyframes m-fade { from { opacity: 0; } }
  .sc-card { width: min(92%, 80vh); max-height: 100%; overflow: hidden; display: grid; grid-template-rows: auto 1fr; border-radius: 3vh; background: #fff; color: #1d1410; box-shadow: 0 3vh 8vh rgb(0 0 0 / .45); animation: scin .7s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes scin { from { opacity: 0; transform: translateY(6vh) scale(.88); } }
  .sc-img { height: 34vh; background: #f6efe9; }
  .sc-img img { width: 100%; height: 100%; object-fit: cover; animation: sczoom 9s ease-out both; }
  @keyframes sczoom { from { transform: scale(1.12); } }
  .sc-body { padding: 2.4vh 3vh 3vh; overflow: hidden; display: grid; gap: 1.1vh; align-content: start; }
  .sc-body h2 { margin: 0; font-family: var(--hf); font-size: clamp(22px, 4.4vh, 50px); line-height: 1.1; animation: scup .6s .15s cubic-bezier(.2,1,.4,1) both; }
  .sc-price { font-family: var(--hf); font-weight: 800; font-size: clamp(20px, 3.8vh, 44px); color: #d6301d; animation: scup .6s .22s cubic-bezier(.2,1,.4,1) both; } .sc-price small { font-size: .55em; }
  .sc-spice { display: flex; align-items: center; gap: 1.2vh; font-weight: 800; font-size: clamp(13px, 2.2vh, 24px); animation: scup .6s .28s both; }
  .sc-spice .chili i { font-style: normal; opacity: .18; filter: grayscale(1); display: inline-block; animation: chili .5s cubic-bezier(.2,1.6,.4,1) both; }
  .sc-spice .chili i.on { opacity: 1; filter: none; }
  @keyframes chili { from { transform: scale(0) rotate(-40deg); } }
  .sc-desc { margin: 0; font-size: clamp(13px, 2.2vh, 24px); line-height: 1.45; color: #4b3d36; animation: scup .6s .32s both; }
  .sc-hl { margin: 0; padding: 0; list-style: none; display: grid; gap: .7vh; }
  .sc-hl li { display: flex; gap: 1vh; align-items: baseline; font-size: clamp(13px, 2.2vh, 24px); font-weight: 700; animation: scup .5s cubic-bezier(.2,1,.4,1) both; }
  .sc-hl li b { color: #16a34a; }
  @keyframes scup { from { opacity: 0; transform: translateY(1.6vh); } }
  @media (prefers-reduced-motion: reduce) { .showcase, .sc-card, .sc-img img, .sc-body *, .it.new .th { animation: none !important; } }
</style>
