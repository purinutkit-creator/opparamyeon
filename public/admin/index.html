<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4202f">
<title>จัดการร้าน · Oppa Ramyeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: .8em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side a { display: block; padding: .55em .8em; border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 600; transition: background .15s; }
  .side a:hover { background: var(--surface2); }
  .side a.on { background: var(--brand-soft); color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
  .kpi { position: relative; overflow: hidden; }
  .kpi.hero { border-top: 4px solid var(--brand); }
  .content { max-width: 1320px; }
  .side h4 { margin: 1em .5em .3em; font-size: .75em; color: var(--muted); text-transform: uppercase; }
  .content { padding: 1em 1.2em 3em; min-width: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .8em; }
  .kpi .lbl { color: var(--muted); font-size: .85em; font-weight: 700; }
  .kpi .val { font-size: 1.9em; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .kpi.hero .val { font-size: 2.6em; color: var(--text); }
  .kpi .sub { font-size: .82em; color: var(--muted); }
  .bar { display: flex; gap: .6em; align-items: center; flex-wrap: wrap; margin-bottom: 1em; }
  .chart { width: 100%; height: 220px; }
  .chart .b { fill: var(--brand); }
  .chart .b:hover { opacity: .8; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--line); }
  .tt { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: .35em .6em; border-radius: 8px; font-size: .85em; z-index: 2000; display: none; }
  .topm { display: none; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 1em; }
  .stale { background: var(--warn-soft); color: var(--warn); padding: .5em .8em; border-radius: 10px; font-weight: 700; }
  .el-row { display: grid; grid-template-columns: auto 1fr auto; gap: .5em; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: .4em .6em; margin-bottom: .4em; background: var(--surface); }
  .el-row.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .designer { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(280px, 420px); gap: 1em; align-items: start; }
  .paper { background: #fff; box-shadow: var(--shadow); border-radius: 6px; padding: 8px; overflow: auto; max-height: 80vh; }
  .paper canvas { display: block; margin: 0 auto; width: 100%; max-width: 420px; image-rendering: pixelated; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 30% 0 0; z-index: 100; transform: translateX(-105%); transition: transform .2s; height: 100vh; box-shadow: var(--shadow); }
    .side.open { transform: none; }
    .topm { display: flex; position: sticky; top: 0; z-index: 50; background: var(--surface); padding: .5em .8em; border-bottom: 1px solid var(--line); align-items: center; gap: .6em; }
    .content { padding: .8em; }
    .designer { grid-template-columns: 1fr; }
  }
  /* v1.2: warm dark sidebar + shaped KPI cards */
  .side { background: linear-gradient(180deg, #2b1712, #3d1d15 60%, #4a2016); border-right: 0; color: #fbe9df; }
  .side::after { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; left: -90px; bottom: -80px; border: 26px solid rgb(255 255 255 / .05); pointer-events: none; }
  .side a { color: #f5ddd2; }
  .side a:hover { background: rgb(255 255 255 / .07); }
  .side a.on { background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgb(232 50 31 / .35); }
  .side h4 { color: #c79a88; }
  .side .version { color: #c79a88; }
  .side .brandbox { display: flex; align-items: center; gap: 10px; padding: .4em .5em 1em; }
  .side .brandbox img { width: 44px; filter: drop-shadow(0 6px 10px rgb(0 0 0 / .3)); }
  .side .brandbox b { font-family: var(--head-font); font-size: 1.15em; color: #fff; display: block; line-height: 1.1; }
  .side .brandbox small { color: #c79a88; }
  .content { position: relative; }
  .kpi { border-radius: 22px; }
  .kpi::after { content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%; right: -40px; top: -40px; background: var(--brand-soft); opacity: .7; }
  .kpi > * { position: relative; z-index: 1; }
  .kpi.hero { border-top: 0; background: var(--grad); color: #fff; box-shadow: 0 16px 34px rgb(232 50 31 / .28); }
  .kpi.hero .lbl, .kpi.hero .sub { color: rgb(255 255 255 / .85); }
  .kpi.hero .val { color: #fff; }
  .kpi.hero::after { background: rgb(255 255 255 / .16); }
  .cards > .kpi.hero:nth-child(2) { background: var(--grad-warm); }
  .cards > .kpi.hero:nth-child(3) { background: linear-gradient(135deg, #3d1d15, #6b2a1c); }
  .page-head h2 { font-size: 1.8em; }
  .topm { background: linear-gradient(90deg, #2b1712, #4a2016); color: #fff; }
  /* barcode labels */
  .lbl-layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 1em; align-items: start; }
  .lbl-side { position: sticky; top: 1em; }
  .lbl-list { max-height: 460px; overflow-y: auto; display: grid; gap: 6px; margin-top: .6em; }
  .lbl-row { display: grid; grid-template-columns: 1fr auto; gap: .6em; align-items: center; padding: .5em .7em; border-radius: 14px; background: var(--surface2); }
  .lbl-row.on { background: var(--brand-soft); box-shadow: inset 0 0 0 2px var(--brand); }
  .lbl-row small { display: block; color: var(--muted); } .lbl-row .mono { font-family: ui-monospace, monospace; }
  .lbl-row .qtyc { display: flex; gap: 4px; align-items: center; }
  .lbl-settings h4 { margin: 1em 0 .4em; } .lbl-settings h4:first-child { margin-top: 0; }
  .chk-grid { display: flex; flex-wrap: wrap; gap: .4em 1em; margin-bottom: .6em; }
  .lbl-canvas { display: grid; place-items: center; padding: 18px; border-radius: 18px; background: repeating-conic-gradient(var(--surface2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; overflow: auto; }
  .lbl-canvas canvas { max-width: 100%; height: auto; box-shadow: 0 6px 20px rgb(0 0 0 / .18); border-radius: 4px; background: #fff; }
  .lbl-out h4 { margin: 1em 0 .4em; } .lbl-out .row select { flex: 1; }
  @media (max-width: 1100px) { .lbl-layout { grid-template-columns: 1fr; } .lbl-side { position: static; } }
  /* Live View */
  .live-btn { display: inline-flex; align-items: center; gap: .45em; font-weight: 800; }
  .live-btn i, .live-card .phase i, .rec { width: 10px; height: 10px; border-radius: 50%; background: #ef2b2b; display: inline-block; box-shadow: 0 0 0 0 rgb(239 43 43 / .6); animation: rec 1.4s infinite; }
  @keyframes rec { 70% { box-shadow: 0 0 0 8px rgb(239 43 43 / 0); } 100% { box-shadow: 0 0 0 0 rgb(239 43 43 / 0); } }
  .live-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 1em; margin-top: 1em; align-items: start; }
  .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1em; align-items: start; }
  .live-card { background: var(--surface); border-radius: 24px; padding: 14px; box-shadow: 0 8px 26px rgb(60 20 10 / .1); display: grid; gap: 10px; position: relative; overflow: hidden; border-top: 5px solid var(--line); }
  .live-card.ph-cart { border-top-color: #f59e0b; } .live-card.ph-pay { border-top-color: var(--brand); box-shadow: 0 10px 30px rgb(232 50 31 / .22); }
  .live-card.ph-done { border-top-color: var(--ok); } .live-card.ph-off { opacity: .6; }
  .lc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .5em; }
  .lc-head b { font-family: var(--head-font); font-size: 1.1em; display: block; } .lc-head small { color: var(--muted); }
  .live-card .phase { display: inline-flex; align-items: center; gap: .4em; font-weight: 800; font-size: .85em; padding: .3em .7em; border-radius: 999px; background: var(--surface2); white-space: nowrap; }
  .live-card .phase i { width: 8px; height: 8px; animation: none; background: var(--muted); }
  .ph-cart .phase { background: #fff4d6; color: #92400e; } .ph-cart .phase i { background: #f59e0b; animation: rec 1.4s infinite; }
  .ph-pay .phase { background: var(--brand-soft); color: var(--brand); } .ph-pay .phase i { background: var(--brand); animation: rec 1s infinite; }
  .ph-done .phase { background: var(--ok-soft); color: var(--ok); } .ph-done .phase i { background: var(--ok); }
  .lc-tags { display: flex; flex-wrap: wrap; gap: .35em; } .lc-tags:empty { display: none; }
  .lc-tags .tag { font-size: .78em; font-weight: 700; background: var(--surface2); border-radius: 999px; padding: .2em .65em; }
  .lc-tags .tag.tw { background: var(--takeaway-soft, #ffedd5); color: var(--takeaway, #c2410c); } .lc-tags .tag.note { background: var(--warn-soft); color: var(--warn); }
  .lc-member { display: grid; grid-template-columns: 36px 1fr auto; gap: .55em; align-items: center; color: #fff; padding: .5em .6em; border-radius: 16px; background: linear-gradient(135deg, #3d1d15, #7a2a1a); }
  .lc-member .av { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgb(255 255 255 / .18); font-family: var(--head-font); }
  .lc-member small { display: block; opacity: .85; } .lc-member .earn { background: #ffcf4a; color: #3d1d15; font-weight: 800; border-radius: 12px; padding: .25em .55em; font-size: .85em; }
  .live-lines { display: grid; gap: 4px; max-height: 340px; overflow-y: auto; }
  .ll { display: grid; grid-template-columns: 34px 1fr auto; gap: .5em; align-items: start; padding: .4em .5em; border-radius: 12px; background: var(--surface2); }
  .ll .q { font-family: var(--head-font); font-weight: 700; font-size: 1.15em; color: var(--brand); text-align: center; }
  .ll small { display: block; color: var(--muted); } .ll small.note { color: var(--warn); font-weight: 700; } .ll small.sent { color: var(--ok); }
  .ll .tw { font-size: .72em; margin-left: .4em; background: #ffedd5; color: #c2410c; border-radius: 999px; padding: .05em .5em; }
  .ll.hot { animation: hot 1.6s ease-out; } @keyframes hot { 0% { background: #ffe08a; transform: scale(1.02); } 100% { background: var(--surface2); transform: none; } }
  .live-empty { display: grid; place-items: center; gap: .3em; color: var(--muted); padding: 1.2em 0; } .live-empty img { width: 64px; opacity: .7; }
  .live-pay { border-radius: 16px; padding: .6em .8em; background: var(--brand-soft); border: 2px dashed var(--brand); display: grid; gap: .2em; }
  .live-done { border-radius: 16px; padding: .8em; background: var(--ok-soft); color: var(--ok); text-align: center; } .live-done small { display: block; color: var(--text); }
  .lc-total { display: flex; justify-content: space-between; align-items: end; border-top: 1px dashed var(--line); padding-top: .5em; }
  .lc-total b { font-family: var(--head-font); font-size: 1.6em; color: var(--brand); }
  .lc-foot { display: flex; justify-content: space-between; align-items: center; }
  .live-feed { background: var(--surface); border-radius: 24px; padding: 14px; box-shadow: var(--shadow); position: sticky; top: 1em; }
  .live-feed h3 { margin: 0 0 .5em; }
  .lf-row { display: grid; grid-template-columns: 52px 1fr auto; gap: .5em; align-items: center; padding: .45em 0; border-bottom: 1px dashed var(--line); animation: pop .3s ease-out; }
  .lf-row .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85em; } .lf-row small { display: block; color: var(--muted); font-size: .78em; }
  .lf-row.void { opacity: .55; text-decoration: line-through; }
  .live-big { position: fixed; inset: 0; z-index: 200; background: rgb(20 9 6 / .6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
  .live-big[hidden] { display: none; }
  .live-big-in { width: min(760px, 100%); max-height: 94vh; overflow-y: auto; background: var(--bg); border-radius: 28px; padding: 18px; }
  .live-card.big { font-size: 1.15em; } .live-card.big .live-lines { max-height: none; }
  @media (max-width: 1100px) { .live-wrap { grid-template-columns: 1fr; } .live-feed { position: static; } }
  @media (prefers-reduced-motion: reduce) { .live-btn i, .live-card .phase i, .rec, .ll.hot { animation: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<div class="tt" id="tt"></div>

</body>
</html>
