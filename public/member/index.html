<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4202f">
<title>สมาชิก · Oppa Ramyeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding-bottom: 104px; background: var(--bg); }
  /* curved gradient header with soft shapes */
  .mhead { position: relative; color: #fff; background: var(--grad); padding: calc(18px + env(safe-area-inset-top)) 20px 64px; border-radius: 0 0 36px 36px; overflow: hidden; }
  .mhead::before { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; right: -110px; top: -140px; background: radial-gradient(circle, rgb(255 255 255 / .25), transparent 65%); }
  .mhead::after { content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%; left: -50px; bottom: -60px; border: 22px solid rgb(255 255 255 / .12); }
  .mhead .row1 { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .mhead .logo { width: 46px; height: 46px; border-radius: 14px; background: rgb(255 255 255 / .2); display: grid; place-items: center; font-size: 26px; overflow: hidden; }
  .mhead .logo img { width: 100%; height: 100%; object-fit: cover; }
  .mhead .name { font-family: var(--head-font); font-size: 1.25em; font-weight: 600; line-height: 1.1; }
  .mhead .sub { opacity: .85; font-size: .9em; }
  .mhead .bowl { position: absolute; right: 14px; bottom: 6px; width: 92px; opacity: .95; z-index: 1; filter: drop-shadow(0 8px 16px rgb(0 0 0 / .25)); }
  .wrap { padding: 0 16px 16px; display: grid; gap: 14px; margin-top: -44px; position: relative; z-index: 2; }
  .card { border-radius: 24px; }
  /* membership card */
  .mcard { border-radius: 26px; padding: 22px; color: #fff; background: radial-gradient(120% 140% at 100% 0%, rgb(255 255 255 / .25), transparent 45%), linear-gradient(140deg, var(--tier, #e8321f), #2b1712 120%);
    box-shadow: 0 18px 40px rgb(60 20 10 / .28); position: relative; overflow: hidden; min-height: 200px; }
  .mcard::before { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; bottom: -90px; border: 28px solid rgb(255 255 255 / .1); }
  .mcard::after { content: '🍜'; position: absolute; right: 18px; bottom: 10px; font-size: 54px; opacity: .22; transform: rotate(-12deg); }
  .mcard .pts { font-family: var(--head-font); font-size: 3em; font-weight: 700; line-height: 1; }
  .mcard .no { letter-spacing: .14em; opacity: .9; font-variant-numeric: tabular-nums; }
  .mcard .chip { width: 42px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, #ffe7a3, #d9a441); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .prog { height: 10px; background: rgb(255 255 255 / .25); border-radius: 99px; overflow: hidden; margin-top: .4em; }
  .prog > i { display: block; height: 100%; background: linear-gradient(90deg, #fff, #ffe3a8); border-radius: 99px; }
  .barcode-card { background: var(--surface); border-radius: 22px; padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .barcode-card canvas { max-width: 100%; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick .btn { flex-direction: column; min-height: 104px; font-size: .9em; border-radius: 22px; background: var(--surface); border: 0; box-shadow: var(--shadow); gap: 8px; text-align: center; line-height: 1.25; }
  .quick .btn { text-decoration: none; color: var(--text); }
  .quick .btn b { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 1.5em; background: var(--c, var(--brand-soft)); }
  .quick .btn:nth-child(1) b { --c: #ffe1d6; } .quick .btn:nth-child(2) b { --c: #ffefc7; } .quick .btn:nth-child(3) b { --c: #e5f6ea; }
  .quick .btn:nth-child(4) b { --c: #e3ecff; } .quick .btn:nth-child(5) b { --c: #f3e3ff; } .quick .btn:nth-child(6) b { --c: #e2f5f7; }
  /* floating pill bottom nav */
  nav.bot { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; right: 12px; max-width: 536px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-radius: 24px; box-shadow: 0 14px 40px rgb(60 20 10 / .18); padding: 6px; z-index: 50; }
  nav.bot a { text-align: center; padding: .45em 0; text-decoration: none; color: var(--muted); font-size: .76em; font-weight: 700; border-radius: 18px; }
  nav.bot a.on { color: #fff; background: var(--grad); box-shadow: 0 6px 16px rgb(232 50 31 / .3); }
  nav.bot a span { display: block; font-size: 1.45em; line-height: 1.2; }
  .coupon { border-radius: 24px; padding: 1.2em; text-align: center; background: var(--surface); box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .coupon::before, .coupon::after { content: ''; position: absolute; top: 50%; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }
  .coupon::before { left: -14px; } .coupon::after { right: -14px; }
  .coupon .code { font-family: var(--head-font); font-size: 1.6em; font-weight: 700; letter-spacing: .12em; }
  .pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  .success-card { text-align: center; background: var(--surface); border-radius: 28px; padding: 28px 20px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
  .success-card::before { content: ''; position: absolute; inset: -40% -20% auto; height: 220px; background: radial-gradient(circle, var(--brand-soft), transparent 70%); }
  .success-card .burst { font-size: 56px; position: relative; animation: pop .5s ease-out; }
  .success-card .big-pts { font-family: var(--head-font); font-size: 3.4em; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; position: relative; }
  .page-title { font-family: var(--head-font); font-size: 1.5em; margin: .2em 0 0; }
  /* raised scan button in the middle of the bottom nav */
  nav.bot a.scanfab { position: relative; padding-top: 0; color: var(--brand); }
  nav.bot a.scanfab.on { background: transparent; box-shadow: none; color: var(--brand); }
  nav.bot a.scanfab .fab { width: 58px; height: 58px; margin: -26px auto 2px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: var(--grad);
    box-shadow: 0 10px 24px rgb(232 50 31 / .4), 0 0 0 5px var(--bg); transform: rotate(-4deg); transition: transform .2s; }
  nav.bot a.scanfab:active .fab { transform: scale(.94); }
  /* scan call-to-action on the home page */
  .scan-cta { display: grid; grid-template-columns: 56px 1fr 24px; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 24px; text-decoration: none; color: #fff;
    background: radial-gradient(120% 160% at 0% 0%, rgb(255 255 255 / .22), transparent 50%), var(--grad); box-shadow: 0 14px 30px rgb(232 50 31 / .3); position: relative; overflow: hidden; }
  .scan-cta::after { content: ''; position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -40px; top: -60px; border: 18px solid rgb(255 255 255 / .12); }
  .scan-cta .ic { width: 56px; height: 56px; border-radius: 18px; background: rgb(255 255 255 / .2); display: grid; place-items: center; }
  .scan-cta b { font-family: var(--head-font); font-size: 1.12em; display: block; line-height: 1.2; }
  .scan-cta small { opacity: .9; }
  .scan-cta .go { font-size: 2em; line-height: 1; opacity: .9; }
  /* camera viewfinder */
  .scan-card { background: var(--surface); border-radius: 28px; padding: 14px; box-shadow: var(--shadow-lg); display: grid; gap: 12px; }
  .viewfinder { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #3d1d15, #140906); }
  .viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .viewfinder .frame { position: absolute; inset: 16%; border-radius: 18px; box-shadow: 0 0 0 999px rgb(20 9 6 / .45); }
  .viewfinder .frame i { position: absolute; width: 34px; height: 34px; border: 5px solid #fff; }
  .viewfinder .frame .c1 { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
  .viewfinder .frame .c2 { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
  .viewfinder .frame .c3 { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
  .viewfinder .frame .c4 { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
  .viewfinder .laser { position: absolute; left: 8%; right: 8%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffb199, #fff, #ffb199, transparent);
    box-shadow: 0 0 14px 3px rgb(255 120 90 / .7); animation: laser 2.2s ease-in-out infinite; }
  @keyframes laser { 0%, 100% { top: 8%; } 50% { top: 90%; } }
  .scan-status { text-align: center; font-weight: 700; padding: .2em .4em; }
  .scan-status.err { color: var(--bad); }
  .scan-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: .8em; text-align: center; color: var(--muted); }
  .scan-steps b { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 1.1em; }
  @media (prefers-reduced-motion: reduce) { .viewfinder .laser { animation: none; top: 50%; } }
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<script type="module" src="/member/member.js"></script>
</body>
</html>
