<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4202f">
<title>สมาชิก · Oppa Ramyeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding-bottom: 104px; background: var(--bg); }
  /* curved gradient header with soft shapes */
  .mhead { position: relative; color: #fff; background: var(--grad); padding: calc(18px + env(safe-area-inset-top)) 20px 64px; border-radius: 0 0 36px 36px; overflow: hidden; }
  .mhead::before { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; right: -110px; top: -140px; background: radial-gradient(circle, rgb(255 255 255 / .25), transparent 65%); }
  .mhead::after { content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%; left: -50px; bottom: -60px; border: 22px solid rgb(255 255 255 / .12); }
  .mhead .row1 { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .mhead .logo { width: 46px; height: 46px; border-radius: 14px; background: rgb(255 255 255 / .2); display: grid; place-items: center; font-size: 26px; overflow: hidden; }
  .mhead .logo img { width: 100%; height: 100%; object-fit: cover; }
  .mhead .name { font-family: var(--head-font); font-size: 1.25em; font-weight: 600; line-height: 1.1; }
  .mhead .sub { opacity: .85; font-size: .9em; }
  .mhead .bowl { width: 92px; opacity: .95; filter: drop-shadow(0 8px 16px rgb(0 0 0 / .25)); }
  .wrap { padding: 0 16px 16px; display: grid; gap: 14px; margin-top: -44px; position: relative; z-index: 2; }
  .card { border-radius: 24px; }
  /* membership card */
  .mcard { border-radius: 26px; padding: 22px; color: #fff; background: radial-gradient(120% 140% at 100% 0%, rgb(255 255 255 / .25), transparent 45%), radial-gradient(90% 90% at 0% 100%, color-mix(in srgb, var(--tier, var(--brand)) 70%, transparent), transparent 60%), linear-gradient(140deg, var(--brand), var(--deep) 120%);
    box-shadow: 0 18px 40px rgb(var(--shadow-rgb) / .28); position: relative; overflow: hidden; min-height: 200px; }
  .mcard::before { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; bottom: -90px; border: 28px solid rgb(255 255 255 / .1); }
  .mcard::after { content: '🍜'; position: absolute; right: 18px; bottom: 10px; font-size: 54px; opacity: .22; transform: rotate(-12deg); }
  .mcard .pts { font-family: var(--head-font); font-size: 3em; font-weight: 700; line-height: 1; }
  .mcard .no { letter-spacing: .14em; opacity: .9; font-variant-numeric: tabular-nums; }
  .mcard .chip { width: 42px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, #ffe7a3, #d9a441); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); }
  .prog { height: 10px; background: rgb(255 255 255 / .25); border-radius: 99px; overflow: hidden; margin-top: .4em; }
  .prog > i { display: block; height: 100%; background: linear-gradient(90deg, #fff, #ffe3a8); border-radius: 99px; }
  .barcode-card { background: var(--surface); border-radius: 22px; padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .barcode-card canvas { max-width: 100%; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick .btn { flex-direction: column; min-height: 104px; font-size: .9em; border-radius: 22px; background: var(--surface); border: 0; box-shadow: var(--shadow); gap: 8px; text-align: center; line-height: 1.25; }
  .quick .btn { text-decoration: none; color: var(--text); }
  .quick .btn b { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 1.5em; background: var(--c, var(--brand-soft)); }
  .quick .btn:nth-child(1) b { --c: #ffe1d6; } .quick .btn:nth-child(2) b { --c: #ffefc7; } .quick .btn:nth-child(3) b { --c: #e5f6ea; }
  .quick .btn:nth-child(4) b { --c: #e3ecff; } .quick .btn:nth-child(5) b { --c: #f3e3ff; } .quick .btn:nth-child(6) b { --c: #e2f5f7; }
  /* floating pill bottom nav */
  nav.bot { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; right: 12px; max-width: 536px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-radius: 24px; box-shadow: 0 14px 40px rgb(var(--shadow-rgb) / .18); padding: 6px; z-index: 50; }
  nav.bot a { text-align: center; padding: .45em 0; text-decoration: none; color: var(--muted); font-size: .76em; font-weight: 700; border-radius: 18px; }
  nav.bot a.on { color: #fff; background: var(--grad); box-shadow: 0 6px 16px rgb(var(--brand-rgb) / .3); }
  nav.bot a span { display: block; font-size: 1.45em; line-height: 1.2; }
  .coupon { border-radius: 24px; padding: 1.2em; text-align: center; background: var(--surface); box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .coupon::before, .coupon::after { content: ''; position: absolute; top: 50%; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }
  .coupon::before { left: -14px; } .coupon::after { right: -14px; }
  .coupon .code { font-family: var(--head-font); font-size: 1.6em; font-weight: 700; letter-spacing: .12em; }
  .pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  .success-card { text-align: center; background: var(--surface); border-radius: 28px; padding: 28px 20px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
  .success-card::before { content: ''; position: absolute; inset: -40% -20% auto; height: 220px; background: radial-gradient(circle, var(--brand-soft), transparent 70%); }
  .success-card .burst { font-size: 56px; position: relative; animation: pop .5s ease-out; }
  .success-card .big-pts { font-family: var(--head-font); font-size: 3.4em; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; position: relative; }
  .page-title { font-family: var(--head-font); font-size: 1.5em; margin: .2em 0 0; }
  /* raised scan button in the middle of the bottom nav */
  nav.bot a.scanfab { position: relative; padding-top: 0; color: var(--brand); }
  nav.bot a.scanfab.on { background: transparent; box-shadow: none; color: var(--brand); }
  nav.bot a.scanfab .fab { width: 58px; height: 58px; margin: -26px auto 2px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: var(--grad);
    box-shadow: 0 10px 24px rgb(var(--brand-rgb) / .4), 0 0 0 5px var(--bg); transform: rotate(-4deg); transition: transform .2s; }
  nav.bot a.scanfab:active .fab { transform: scale(.94); }
  /* scan call-to-action on the home page */
  .scan-cta { display: grid; grid-template-columns: 56px 1fr 24px; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 24px; text-decoration: none; color: #fff;
    background: radial-gradient(120% 160% at 0% 0%, rgb(255 255 255 / .22), transparent 50%), var(--grad); box-shadow: 0 14px 30px rgb(var(--brand-rgb) / .3); position: relative; overflow: hidden; }
  .scan-cta::after { content: ''; position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -40px; top: -60px; border: 18px solid rgb(255 255 255 / .12); }
  .scan-cta .ic { width: 56px; height: 56px; border-radius: 18px; background: rgb(255 255 255 / .2); display: grid; place-items: center; }
  .scan-cta b { font-family: var(--head-font); font-size: 1.12em; display: block; line-height: 1.2; }
  .scan-cta small { opacity: .9; }
  .scan-cta .go { font-size: 2em; line-height: 1; opacity: .9; }
  /* camera viewfinder */
  .scan-card { background: var(--surface); border-radius: 28px; padding: 14px; box-shadow: var(--shadow-lg); display: grid; gap: 12px; }
  .viewfinder { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--deep-2), #140906); }
  .viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .viewfinder .frame { position: absolute; inset: 16%; border-radius: 18px; box-shadow: 0 0 0 999px rgb(20 9 6 / .45); }
  .viewfinder .frame i { position: absolute; width: 34px; height: 34px; border: 5px solid #fff; }
  .viewfinder .frame .c1 { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
  .viewfinder .frame .c2 { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
  .viewfinder .frame .c3 { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
  .viewfinder .frame .c4 { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
  .viewfinder .laser { position: absolute; left: 8%; right: 8%; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffb199, #fff, #ffb199, transparent);
    box-shadow: 0 0 14px 3px rgb(255 120 90 / .7); animation: laser 2.2s ease-in-out infinite; }
  @keyframes laser { 0%, 100% { top: 8%; } 50% { top: 90%; } }
  .scan-status { text-align: center; font-weight: 700; padding: .2em .4em; }
  .scan-status.err { color: var(--bad); }
  .scan-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: .8em; text-align: center; color: var(--muted); }
  .scan-steps b { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 1.1em; }
  /* ===== v1.16.1: motion & sparkle ===== */
  .mhead { background: var(--grad); background-size: 220% 220%; animation: mgrad 14s ease-in-out infinite; }
  @keyframes mgrad { 0%, 100% { background-position: 0% 30%; } 50% { background-position: 100% 70%; } }
  .bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubbles i { position: absolute; bottom: -30px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgb(255 255 255 / .55), rgb(255 255 255 / .08) 60%); scale: var(--s, 1); animation: bub linear infinite; }
  @keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-220px) translateX(18px); opacity: 0; } }
  .bowlwrap { position: absolute; right: 14px; bottom: 6px; width: 92px; z-index: 1; animation: bob 4s ease-in-out infinite; }
  .bowlwrap .bowl { position: static; width: 100%; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
  .steam { position: absolute; left: 22%; right: 22%; top: -18px; display: flex; justify-content: space-around; }
  .steam i { width: 6px; height: 22px; border-radius: 6px; background: linear-gradient(transparent, rgb(255 255 255 / .8)); filter: blur(2px); animation: steam 2.6s ease-in-out infinite; }
  .steam i:nth-child(2) { animation-delay: .6s; } .steam i:nth-child(3) { animation-delay: 1.2s; }
  @keyframes steam { 0% { transform: translateY(8px) scaleY(.6); opacity: 0; } 50% { opacity: .9; } 100% { transform: translateY(-16px) scaleY(1.2); opacity: 0; } }
  /* every page: its blocks rise in one after another */
  .wrap.enter > * { animation: rise .5s cubic-bezier(.2,.9,.3,1.15) both; }
  .wrap.enter > *:nth-child(2) { animation-delay: .06s; } .wrap.enter > *:nth-child(3) { animation-delay: .12s; } .wrap.enter > *:nth-child(4) { animation-delay: .18s; }
  .wrap.enter > *:nth-child(5) { animation-delay: .24s; } .wrap.enter > *:nth-child(n+6) { animation-delay: .3s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  /* holographic membership card that leans with the finger */
  .mcard { transition: transform .25s ease-out, box-shadow .3s; transform-style: preserve-3d; will-change: transform; }
  .mcard .holo { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; mix-blend-mode: overlay; z-index: 0;
    background: radial-gradient(60% 80% at var(--mx, 30%) var(--my, 20%), rgb(255 255 255 / .55), transparent 60%),
      linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .35) 45%, rgb(255 220 150 / .3) 50%, transparent 62%); background-size: 100% 100%, 250% 100%; animation: holo 5s ease-in-out infinite; }
  @keyframes holo { 0%, 100% { background-position: 0 0, 140% 0; } 50% { background-position: 0 0, -40% 0; } }
  .mcard > *:not(.holo) { position: relative; z-index: 1; }
  .mcard .chip { background: linear-gradient(135deg, #ffe7a3, #d9a441, #fff1c4, #d9a441); background-size: 300% 300%; animation: chipshine 4s ease-in-out infinite; }
  @keyframes chipshine { 50% { background-position: 100% 100%; } }
  .mcard .pts { font-variant-numeric: tabular-nums; text-shadow: 0 4px 18px rgb(0 0 0 / .2); }
  .prog > i { width: var(--w, 0%); animation: grow 1.2s .3s cubic-bezier(.2,.9,.3,1) both; position: relative; overflow: hidden; }
  .prog > i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .8), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: progshine 2.4s 1.5s linear infinite; }
  @keyframes grow { from { width: 0; } }
  @keyframes progshine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .sparkles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .sparkles i { position: absolute; font-style: normal; font-size: 20px; animation: twinkle 1.2s ease-out both; }
  @keyframes twinkle { 0% { transform: scale(0) rotate(0); opacity: 0; } 40% { transform: scale(1.3) rotate(40deg); opacity: 1; } 100% { transform: scale(.4) rotate(120deg) translateY(-30px); opacity: 0; } }
  /* buttons that feel alive */
  .quick .btn { transition: transform .18s cubic-bezier(.2,1.5,.4,1), box-shadow .2s; }
  .quick .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgb(var(--shadow-rgb) / .15); }
  .quick .btn:active { transform: scale(.95); }
  .quick .btn b { transition: transform .3s cubic-bezier(.2,1.6,.4,1); }
  .quick .btn:hover b, .quick .btn:active b { transform: rotate(-10deg) scale(1.12); }
  .scan-cta::before { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .28) 50%, transparent 65%); background-size: 250% 100%; animation: sweep 3.6s ease-in-out infinite; pointer-events: none; }
  @keyframes sweep { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .scan-cta .go { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); } }
  .scan-cta .ic { animation: icpulse 2.4s ease-in-out infinite; }
  @keyframes icpulse { 50% { box-shadow: 0 0 0 8px rgb(255 255 255 / .12); } }
  nav.bot a { transition: background .25s, color .25s, transform .2s; }
  nav.bot a.on:not(.scanfab) { animation: navpop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes navpop { 40% { transform: scale(1.1); } }
  nav.bot a.scanfab .fab { animation: fabring 2.6s ease-in-out infinite; }
  @keyframes fabring { 50% { box-shadow: 0 10px 24px rgb(var(--brand-rgb) / .45), 0 0 0 5px var(--bg), 0 0 0 11px rgb(var(--brand-rgb) / .18); } }
  .coupon { transition: transform .2s; } .coupon:active { transform: scale(.98); }
  .card { transition: box-shadow .25s, transform .2s; }
  /* claim success: rays + confetti */
  .success-card .rays { position: absolute; left: 50%; top: 60px; width: 520px; height: 520px; margin-left: -260px; margin-top: -260px; opacity: .25; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--brand) 0 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(circle, #000, transparent 60%); mask: radial-gradient(circle, #000, transparent 60%); animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-card .burst { animation: popbig .7s cubic-bezier(.2,1.6,.4,1) both, wiggle 2.4s 1s ease-in-out infinite; }
  @keyframes popbig { from { transform: scale(0) rotate(-30deg); } }
  @keyframes wiggle { 0%, 80%, 100% { transform: none; } 88% { transform: rotate(-12deg) scale(1.1); } 94% { transform: rotate(10deg); } }
  .mconfetti { position: fixed; inset: 0; pointer-events: none; z-index: 2000; overflow: hidden; }
  .mconfetti i { position: absolute; top: -12px; width: 9px; height: 15px; border-radius: 3px; animation: mfall ease-in forwards; }
  @keyframes mfall { to { transform: translateY(110vh) rotate(var(--r)); } }
  [data-pos-fx="off"] *, [data-pos-fx="off"] *::before, [data-pos-fx="off"] *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .viewfinder .laser { animation: none; top: 50%; } .mhead, .bubbles i, .bowlwrap, .steam i, .wrap.enter > *, .mcard .holo, .scan-cta::before, .scan-cta .go, nav.bot a.scanfab .fab { animation: none !important; } }
</style>
</head>

</body>
