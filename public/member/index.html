<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4202f">
<title>สมาชิก · Oppa Ramyeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding-bottom: 84px; }
  .top { padding: 1em; display: flex; align-items: center; gap: .6em; }
  .top img { height: 40px; border-radius: 10px; }
  .wrap { padding: 0 1em 1em; display: grid; gap: .9em; }
  .mcard { border-radius: 20px; padding: 1.2em; color: #fff; background: linear-gradient(135deg, var(--tier, #d4202f), #111); box-shadow: var(--shadow); position: relative; overflow: hidden; min-height: 180px; }
  .mcard .pts { font-size: 2.6em; font-weight: 800; line-height: 1; }
  .mcard .no { letter-spacing: .15em; opacity: .9; }
  .prog { height: 10px; background: rgb(255 255 255 / .25); border-radius: 99px; overflow: hidden; margin-top: .4em; }
  .prog > i { display: block; height: 100%; background: #fff; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
  .quick .btn { flex-direction: column; min-height: 86px; font-size: .95em; }
  .quick .btn b { font-size: 1.6em; }
  nav.bot { position: fixed; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.bot a { text-align: center; padding: .55em 0; text-decoration: none; color: var(--muted); font-size: .8em; font-weight: 700; }
  nav.bot a.on { color: var(--brand); }
  nav.bot a span { display: block; font-size: 1.5em; }
  .coupon { border: 2px dashed var(--brand); border-radius: 16px; padding: 1em; text-align: center; background: var(--surface); }
  .coupon .code { font-size: 1.6em; font-weight: 800; letter-spacing: .12em; }
  .pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<script type="module" src="/member/member.js"></script>
</body>
</html>
